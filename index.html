<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Lab — 블록 · 파이썬</title>
<meta name="description" content="블록과 파이썬으로 코딩하고, 브라우저나 piBrain 에서 바로 실행해요.">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta name="theme-color" content="#FBF7EF">
<link rel="stylesheet" href="assets/fonts/pretendard.css?v=1">
<link rel="stylesheet" href="css/all.min.css?v=1">
<link rel="stylesheet" href="css/themaker-ui.css?v=1">
<link rel="stylesheet" href="vendor/codemirror/codemirror.css?v=1">
<link rel="stylesheet" href="vendor/codemirror/cobalt.css?v=1">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>

<header>
  <h1><img src="assets/img/pibo-logo.png" alt=""><span class="brand-txt">Code Lab</span></h1>
  <button type="button" class="navlink" data-mode="block"><i class="fa-solid fa-cubes"></i>블록</button>
  <button type="button" class="navlink" data-mode="python"><i class="fa-brands fa-python"></i>파이썬</button>
  <span class="cl-flex"></span>
  <span class="badge" id="devBadge">piBrain 연결 안 됨</span>
  <button type="button" class="hbtn" id="fsBtn" title="전체화면"></button>
</header>

<div class="cl-bar">
  <span class="cl-lb">실행 위치</span>
  <div class="seg">
    <button type="button" data-target="browser"><i class="fa-solid fa-globe"></i>브라우저</button>
    <button type="button" data-target="device"><i class="fa-solid fa-microchip"></i>piBrain</button>
  </div>
  <button type="button" class="db cl-dev" id="connBtn"></button>
  <button type="button" class="db cl-dev" id="dispBtn" title="piBrain 화면을 네트워크 정보로 돌려요"><i class="fa-solid fa-display"></i> 화면 처음으로</button>

  <span class="cl-sep"></span>
  <button type="button" class="db go" id="runBtn" title="실행 (Ctrl+Enter)"><i class="fa-solid fa-play"></i> 실행</button>
  <button type="button" class="db" id="stopBtn" title="정지 (Esc)"><i class="fa-solid fa-stop"></i> 정지</button>

  <span class="cl-sep"></span>
  <span class="cl-drop" id="exBtnWrap">
    <button type="button" class="db" id="exBtn"><i class="fa-solid fa-book-open"></i> 예제 <i class="fa-solid fa-caret-down"></i></button>
    <span class="cl-menu" id="exMenu" hidden></span>
  </span>
  <button type="button" class="db" id="importBtn" title=".json(블록) 또는 .py(파이썬) 파일"><i class="fa-solid fa-folder-open"></i> 불러오기</button>
  <button type="button" class="db" id="exportBtn" title="블록은 .json, 파이썬은 .py 로 내보내요"><i class="fa-solid fa-download"></i> 내보내기</button>
  <input type="file" id="importFile" accept=".json,.py,.txt">

  <span class="cl-flex"></span>
  <span class="cl-font">
    <span class="cl-lb">글자</span>
    <button type="button" class="db" id="fontDown" title="글자 작게">−</button>
    <span id="fontSize" class="num">16</span>
    <button type="button" class="db" id="fontUp" title="글자 크게">+</button>
  </span>
</div>

<main class="mk-main" id="clMain">

  <section class="pan pan-wide" id="panEdit">
    <div class="ph"><i id="editIcon" class="fa-solid fa-cubes"></i><span id="editTitle">블록 편집기</span></div>
    <div class="cl-edit">
      <div id="blocklyDiv"></div>
      <div id="pyWrap" hidden><textarea id="pyCode"></textarea></div>
    </div>
    <div class="cl-statusbar">
      <span id="status" class="cl-status">준비</span>
      <span id="execTime" class="num"></span>
      <span class="cl-flex"></span>
      <span id="cursorPos" class="num">줄 1, 칸 1</span>
    </div>
  </section>

  <div class="cl-splitter" id="splitter" title="끌어서 넓이 바꾸기"></div>

  <section class="pan pan-out" id="panOut">
    <div class="ph">
      <button type="button" class="cl-tab" data-tab="out"><i class="fa-solid fa-terminal"></i>결과</button>
      <button type="button" class="cl-tab" data-tab="draw" id="tabDrawBtn"><i class="fa-solid fa-robot"></i>그림</button>
      <button type="button" class="cl-tab" data-tab="code" id="tabCodeBtn"><i class="fa-brands fa-python"></i>코드</button>
      <span class="cl-flex"></span>
      <button type="button" class="db danger cl-mini" id="clearBtn" title="결과 지우기"><i class="fa-solid fa-eraser"></i> 지우기</button>
    </div>

    <div class="cl-tabpane" id="tab-out">
      <div class="cl-out" id="outBox">
        <pre id="outText"></pre>
        <div class="cl-in" id="inRow" hidden>
          <span class="cl-in-mark">▸</span>
          <input type="text" id="inField" autocomplete="off" spellcheck="false" placeholder="여기에 입력하고 Enter">
        </div>
      </div>
    </div>

    <div class="cl-tabpane" id="tab-draw">
      <div id="turtle"></div>
    </div>

    <div class="cl-tabpane" id="tab-code">
      <div id="codeView"></div>
      <div class="cl-codebar">
        <span class="hint">블록이 만든 파이썬 코드예요</span>
        <span class="cl-flex"></span>
        <button type="button" class="db cl-mini" id="pyBtn" title=".py 파일로 받기"><i class="fa-solid fa-download"></i> .py</button>
        <button type="button" class="db cl-mini" id="toPyBtn"><i class="fa-solid fa-pen"></i> 파이썬으로 고치기</button>
      </div>
    </div>
  </section>

</main>

<div id="toast" class="toast"></div>

<!-- 실행기 · 편집기 -->
<script src="vendor/skulpt/skulpt.min.js?v=1"></script>
<script src="vendor/skulpt/skulpt-stdlib.js?v=1"></script>
<script src="vendor/codemirror/codemirror.min.js?v=1"></script>
<script src="vendor/codemirror/python.js?v=1"></script>

<!-- 블록 -->
<script src="blocks/ko2en.js?v=1"></script>
<script src="vendor/blockly/blockly_compressed.js?v=1"></script>
<script src="vendor/blockly/blocks_compressed.js?v=1"></script>
<script src="vendor/blockly/python_compressed.js?v=1"></script>
<script src="vendor/blockly/ko.js?v=1"></script>
<script src="blocks/field-bitmap.js?v=1"></script>
<script src="blocks/customblock.js?v=1"></script>
<script src="blocks/customblock_callback.js?v=1"></script>
<script src="blocks/customblock_toolbox.js?v=1"></script>
<script src="blocks/disable-top-blocks.js?v=1"></script>

<!-- Code Lab -->
<script src="lib/examples.js?v=1"></script>
<script src="lib/pibrain-serial.js?v=1"></script>
<script src="lib/app.js?v=1"></script>
</body>
</html>
