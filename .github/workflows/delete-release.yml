name: 릴리스 지우기

# 잘못 올린 릴리스를 태그까지 함께 지운다. 태그를 직접 push/삭제할 수 없는
# 환경(사내 git 프록시 등)이 있어서 Actions 탭에서 누른다.
#
#   Actions → 릴리스 지우기 → Run workflow → tag 에 v0.2.1 입력

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '지울 릴리스 태그 (예: v0.2.1). 릴리스와 태그가 함께 지워진다'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 릴리스 + 태그 지우기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "태그는 v 로 시작해야 합니다: $TAG"; exit 1 ;; esac
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
