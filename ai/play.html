<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teach Lab — 놀이실</title>
<meta name="description" content="가르친 AI와 이미 아는 것을 엮어 규칙 놀이·순서 놀이를 해요. AI가 소리 내어 말해요.">
<link rel="icon" type="image/png" href="../shared/assets/img/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#FBF7EF">
<link rel="stylesheet" href="../shared/assets/fonts/pretendard.css">
<link rel="stylesheet" href="../shared/css/all.min.css">
<link rel="stylesheet" href="../shared/css/themaker-ui.css">
<link rel="stylesheet" href="css/app.css?v=4">
<link rel="stylesheet" href="../shared/ui/lab.css">
</head>
<body>

<header data-tab="play.html" data-menu="make" data-act="flow"></header>

<div class="mk-main">

  <!-- 왼쪽: 무엇을 볼까요 -->
  <div class="pan pan-side" id="panL">
    <div class="ph"><i class="fa-solid fa-eye"></i>무엇을 볼까요?</div>
    <div class="pb">
      <div id="srcCards"></div>
      <div class="hint"><i class="fa-solid fa-lightbulb"></i> 눌러서 켜고 꺼요. 그냥 보기는 배우지 않아도 돼요.</div>
    </div>
  </div>

  <!-- 가운데: 카메라 · 지금 보이는 것 · 배경 놀이 -->
  <div class="pan pan-wide" id="panC">
    <div class="ph"><i class="fa-solid fa-camera"></i>카메라</div>
    <div class="pb">
      <div class="row" style="margin-bottom:10px">
        <button class="db go" id="camBtn" style="flex-shrink:0"><i class="fa-solid fa-video"></i> 카메라 켜기</button>
        <select class="inp" id="camSel" style="cursor:pointer"></select>
      </div>
      <div id="camBox" class="m-landmark">
        <video id="camVid" playsinline muted></video>
        <canvas id="bgCv" style="display:none"></canvas>
        <canvas id="ovCv"></canvas>
        <div id="camOff"><i class="fa-solid fa-video-slash fa-2x"></i><span>카메라가 꺼져 있어요</span></div>
      </div>
      <div class="privnote">찍은 영상과 소리는 이 컴퓨터 밖으로 나가지 않아요</div>

      <div class="pb-label" style="margin-top:12px">AI가 지금 보는 것</div>
      <div id="nowRow" class="nowrow"></div>

      <div class="pb-label" style="margin-top:12px">배경 놀이</div>
      <div id="bgPick" class="swatches"></div>
    </div>
  </div>

  <!-- 오른쪽: 놀이 -->
  <div class="pan pan-out" id="panR">
    <div class="ph"><i class="fa-solid fa-gamepad"></i>놀이</div>
    <div class="pb">
      <div class="playtabs" id="modeTabs">
        <button type="button" data-mode="rule"><i class="fa-solid fa-wand-magic-sparkles"></i>규칙 놀이</button>
        <button type="button" data-mode="seq"><i class="fa-solid fa-flag-checkered"></i>순서 놀이</button>
      </div>

      <div class="answer idk playans" id="answer"></div>
      <button type="button" class="voicebtn" id="voiceBtn"></button>

      <div id="ruleOut">
        <div class="hint" style="margin-top:4px">"만약 ○○ 하면" AI가 말해요.</div>
        <div id="ruleList"></div>
        <button class="db bigadd" id="ruleAdd"><i class="fa-solid fa-plus"></i> 규칙 만들기</button>
      </div>

      <div id="seqOut" style="display:none">
        <div class="hint" style="margin-top:4px">순서대로 하면 한 칸씩 내려가요.</div>
        <div id="seqFlow"></div>
        <div class="row" style="margin-top:9px">
          <button class="db bigadd" id="seqAdd" style="flex:1"><i class="fa-solid fa-plus"></i> 단계 더하기</button>
          <button class="db bigadd" id="seqReset" style="flex:1"><i class="fa-solid fa-rotate-left"></i> 처음부터</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 고르기 창: 규칙의 조건·순서의 단계를 큰 칩으로 고른다 -->
<div class="picker" id="picker" hidden>
  <div class="pk-box" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
    <div class="pk-head">
      <span id="pkTitle">무엇을 하면 될까요?</span>
      <button type="button" class="hbtn" id="pkClose" title="닫기"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="pk-tip">지금 맞는 것은 불이 켜져요. 직접 해 보고 골라요.</div>
    <div id="pkBody"></div>
  </div>
</div>

<div id="toast"></div>

<script src="../shared/ui/menu.js"></script>
<script src="../shared/ui/nav.js"></script>
<script src="lib/i18n.js?v=3"></script>
<script src="lib/tour.js?v=3"></script>
<script type="module" src="lib/play.js?v=3"></script>
</body>
</html>
