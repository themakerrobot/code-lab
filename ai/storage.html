<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보관함 — AI Lab</title>
<meta name="description" content="가르친 모델을 보관하고, 파일 하나로 내보내거나 다시 불러옵니다.">
<link rel="icon" type="image/png" href="../shared/assets/img/favicon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#FBF7EF">
<link rel="stylesheet" href="../shared/assets/fonts/pretendard.css">
<link rel="stylesheet" href="../shared/css/all.min.css">
<link rel="stylesheet" href="../shared/css/themaker-ui.css">
<link rel="stylesheet" href="css/app.css?v=3">
<link rel="stylesheet" href="../shared/ui/lab.css">
</head>
<body>

<header data-tab="storage.html" data-menu="box"></header>

<div class="mk-main">

  <div class="pan pan-wide" id="panC">
    <div class="ph"><i class="fa-solid fa-box-archive"></i>저장한 모델</div>
    <div class="pb">
      <table class="mk-table" id="stTable"></table>
      <div class="hint" id="stEmpty" style="display:none">
        <i class="fa-solid fa-lightbulb"></i> 아직 저장한 모델이 없어요. 학습실에서 먼저 가르쳐 주세요.
      </div>
    </div>
  </div>

  <div class="pan pan-out" id="panR">
    <div class="ph"><i class="fa-solid fa-file-zipper"></i>파일로 주고받기</div>
    <div class="pb">
      <div class="pb-label">다시 불러오기</div>
      <div class="dropzone" id="dropzone">
        내보낸 파일을 여기에 놓으면 다시 들어와요.<br>(눌러서 고르기)
      </div>
      <input type="file" id="zipInput" accept=".zip">

      <div class="sec2">
        <div class="st">내보내기</div>
        <div class="hint" style="margin-top:0">
          프로젝트 파일은 다른 컴퓨터의 AI Lab 에서 그대로 열려요. 예시까지 들어 있어 이어서 배울 수 있어요.
        </div>
      </div>

      <div class="sec2">
        <div class="st">알아 두기</div>
        <div class="stnote">
          모델은 이 컴퓨터의 브라우저 안에만 저장돼요. 다른 곳으로 옮기거나 오래 보관할 때는 꼭 내보내기를 쓰세요.
        </div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="../shared/ui/menu.js"></script>
<script src="../shared/ui/nav.js"></script>
<script src="lib/i18n.js?v=2"></script>
<script src="lib/tour.js?v=2"></script>
<script src="lib/jszip.min.js"></script>
<script type="module" src="lib/storage_page.js?v=2"></script>
</body>
</html>
